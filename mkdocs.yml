site_name: CleanOps Documentatie
site_description: Officiële handleiding voor CleanOps
site_author: Dominique
site_url: https://docs.cleanops.eu/
copyright: >
  CleanOps &copy; 2026 — eigendom van
  <a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
  Alle rechten voorbehouden.

theme:
  name: material
  language: nl
  logo: images/logo.svg
  favicon: images/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  # ⚠️ Dit palet staat TWEE KEER: hier en nogmaals in het i18n-taalblok voor het Frans, en dat tweede blok
  # WINT voor /fr/. Gemeten 14/08/2026: enkel dit blok op black zetten gaf `primary="black"` in site/index.html
  # en `primary="teal"` in site/fr/index.html. Wie in één taal test, ziet dat niet. Pas ze dus samen aan.
  # Gemeld door de Nimble-sessie, die dezelfde dubbele declaratie had.
  palette:
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Schakel naar donkere modus
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Schakel naar lichte modus
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
  - stylesheets/embed.css

extra_javascript:
  - javascripts/embed.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  # Iconen (:material-…:) voor het kaartraster op de onthaalpagina.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - nl
        - fr
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: nl
          default: true
          name: Nederlands
          build: true
          site_name: CleanOps Documentatie
          site_description: Officiële handleiding voor CleanOps
        - locale: fr
          name: Français
          build: true
          site_name: CleanOps Documentation
          site_description: Manuel officiel de CleanOps
          copyright: >
            CleanOps &copy; 2026 — propriété d'<a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
            Tous droits réservés.
          theme:
            language: fr
            # ⚠️ Tweede exemplaar van het palet — dit blok wint voor /fr/. Houd het gelijk met theme.palette
            # hierboven; zie de nota daar.
            palette:
              - scheme: default
                primary: white
                accent: teal
                toggle:
                  icon: material/brightness-7
                  name: Passer en mode sombre
              - scheme: slate
                primary: black
                accent: teal
                toggle:
                  icon: material/brightness-4
                  name: Passer en mode clair
          nav_translations:
            Home: Accueil
            Aan de slag: Premiers pas
            Installatie: Installation
            Eerste aanmelding: Première connexion
            Interface-overzicht: Aperçu de l'interface
            Dashboard: Tableau de bord
            Werkzaamheden: Opérations
            Overzicht: Aperçu
            Contracten: Contrats
            Generatie opdrachten: Génération des ordres
            Opdrachten: Ordres de travail
            Planning: Planning
            Personeel groeperen: Groupement du personnel
            CRM: CRM
            Klanten: Clients
            Leveranciers: Fournisseurs
            Medewerkers: Collaborateurs
            Overzicht verloven: Aperçu des congés
            Verlofsaldi: Soldes de congés
            Attesten: Attestations
            Producten: Produits
            Verwerkingen: Traitements
            Verwerkingsbedrijven: Entreprises de traitement
            Raadplegen en bewerken: Consulter et modifier
            Facturatie: Facturation
            Offertebeheer: Gestion des devis
            Overzicht te factureren: Aperçu à facturer
            Aanmaken facturen: Création des factures
            Factureren werkorders: Facturer les bons de travail
            Afdruk facturen: Impression des factures
            Rappelbeheer: Gestion des rappels
            Openstaande posten: Postes ouverts
            "Op te volgen memo's": "Mémos à suivre"
            Schuldbemiddelingen: Médiation de dettes
            Documentnummers: Numéros de documents
            Boekhouding: Comptabilité
            Boekjaren: Exercices comptables
            Dagboeken: Journaux
            Type documenten: Types de documents
            Bankverrichtingen: Opérations bancaires
            Ingave betalingen: Saisie des paiements
