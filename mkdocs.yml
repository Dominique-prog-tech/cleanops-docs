extra:
  generator: false

# Alleen KLARE pagina's staan hier (playbook: handleiding groeit mee per vrijgave, zelfde discipline als
# nimble-docs). Het volledige skelet uit de Delphi-scan (Aan de slag, Werkzaamheden, CRM, Attesten,
# Facturatie, Boekhouding, Aankoopdocumenten, Beheer, Mijn gebruiker, Concepten — met TODO-stubs) blijft op
# schijf staan onder docs/, maar komt pas in deze nav (en dus live op docs.cleanops.eu) zodra een pagina echt
# af is. Voeg per vrijgegeven module de betreffende regel(s) hier terug toe.
nav:
  - Home: index.md
  - Klanten: klanten.md
