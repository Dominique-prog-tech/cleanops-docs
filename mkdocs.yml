site_name: CleanOps Documentatie
site_description: Officiële handleiding voor CleanOps
site_author: Dominique
site_url: https://docs.cleanops.eu/
copyright: >
  CleanOps &copy; 2026 — eigendom van
  <a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
  Alle rechten voorbehouden.

theme:
  name: material
  language: nl
  logo: images/logo.svg
  favicon: images/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  # ⚠️ Dit palet staat TWEE KEER: hier en nogmaals in het i18n-taalblok voor het Frans, en dat tweede blok
  # WINT voor /fr/. Gemeten 14/08/2026: enkel dit blok op black zetten gaf `primary="black"` in site/index.html
  # en `primary="teal"` in site/fr/index.html. Wie in één taal test, ziet dat niet. Pas ze dus samen aan.
  # Gemeld door de Nimble-sessie, die dezelfde dubbele declaratie had.
  palette:
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Schakel naar donkere modus
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Schakel naar lichte modus
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
  - stylesheets/embed.css

extra_javascript:
  - javascripts/embed.js
  # Plausible Analytics — cookieloos, geen persoonsgegevens, EU-hosting; dus
  # geen toestemmingsbanner nodig. Via extra_javascript belandt dit in ELKE
  # gegenereerde pagina, ook in pagina's die er later bij komen.
  - https://plausible.io/js/pa-t-auKVF4n6YRwXPdKW87p.js
  - javascripts/plausible-init.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  # Iconen (:material-…:) voor het kaartraster op de onthaalpagina.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - nl
        - fr
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: nl
          default: true
          name: Nederlands
          build: true
          site_name: CleanOps Documentatie
          site_description: Officiële handleiding voor CleanOps
        - locale: fr
          name: Français
          build: true
          site_name: CleanOps Documentation
          site_description: Manuel officiel de CleanOps
          copyright: >
            CleanOps &copy; 2026 — propriété d'<a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
            Tous droits réservés.
          theme:
            language: fr
            # ⚠️ Tweede exemplaar van het palet — dit blok wint voor /fr/. Houd het gelijk met theme.palette
            # hierboven; zie de nota daar.
            palette:
              - scheme: default
                primary: white
                accent: teal
                toggle:
                  icon: material/brightness-7
                  name: Passer en mode sombre
              - scheme: slate
                primary: black
                accent: teal
                toggle:
                  icon: material/brightness-4
                  name: Passer en mode clair
          nav_translations:
            # ⚠️ Elk nav-item heeft hier een regel nodig, óók wanneer de Franse pagina een Franse H1
            # draagt: mkdocs-static-i18n vertaalt de ZIJBALK enkel via deze tabel. Zonder regel staat
            # de Nederlandse titel in de Franse navigatie, terwijl de pagina zelf correct Frans is —
            # dat is precies waarom het lang niemand opviel. Gemeten 24/08/2026 in de gebouwde site:
            # vier van de zes Beheer-items stonden er nog in het Nederlands.
