name: Deploy MkDocs

# Pages-activatie staat uit zolang de repo private is op een Free plan.
# Wanneer je publiek wil gaan (of GitHub Pro hebt), activeer Pages via
# Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Vaste versies — zie requirements.txt. Zonder pin haalt elke bouw binnen wat er die dag
      # nieuw staat, en MkDocs 2.0 schrapt het plugin-systeem waar onze tweetaligheid op draait.
      - run: pip install -r requirements.txt
      # --strict (sinds 10/10/2026, toen de site voor zoekmachines openging): een link naar een pagina of een
      # #anker dat niet bestaat laat de bouw FALEN (zie `validation:` in mkdocs.yml). De vorige versie blijft dan
      # online staan. Zonder --strict was een dode link een regel in dit logboek die niemand las.
      # De gedeelde filmhook (mkdocs.yml → _appkit/tools/filmgenerator/films_hook.py) en de filmcontrole wonen in
      # adm-appkit, en die repo is privé: meelezen met het repo-geheim ADM_APPKIT_LEZEN (fine-grained token, enkel
      # adm-appkit, Contents: Read-only — NOTEER DE VERVALDATUM). Zonder deze stap vindt mkdocs de hook niet. Zoals nimble-docs.
      - uses: actions/checkout@v4
        with:
          repository: ADM-Concept/adm-appkit
          token: ${{ secrets.ADM_APPKIT_LEZEN }}
          path: _appkit
          sparse-checkout: tools/filmgenerator
      - run: mkdocs build --strict
      # Staat elke film onder de H1 van zijn pagina, met een volledig VideoObject? Meet de GEBOUWDE site.
      # --min-paginas: 5 films × 2 talen = 10 handleidingrijen (27/10/2026). Verhoog bij elke nieuwe film — de bodem vangt een
      # uitslagtabel die stil gekrompen is; daarom komt hij niet uit diezelfde tabel.
      - name: Films controleren (plaatsing + videogegevens)
        run: python3 _appkit/tools/filmgenerator/check-films.py --min-paginas=10
      # Staat elk beeld uit de bron ook als <img> in de gebouwde site? Bij Nimble en CreditSoft verdwenen op 19/10/2026
      # alle schermafdrukken bij het bouwen (selectolax 1.0.1, zie requirements.txt) terwijl alle stappen groen bleven.
      # Deze mag de uitrol TEGENHOUDEN.
      - name: Beelden controleren (bron tegen gebouwde site)
        run: python3 tools/check-beelden.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
